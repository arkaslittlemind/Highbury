# Hand-written identity data for the loaders. It always wins over what the
# resolver finds. Load the nicknames with: python -m ingest.curated
#
# teams: source spellings of a club. The Understat, football-data, and FPL loaders
# read them; the StatsBomb names are the canonical names. A spelling that is not here
# is already the name in teams.
#
# players: one entry for each source record that the resolver must not decide.
# Link it to a canonical player (season is a seasons.label, player is the exact
# players.name of that season), or keep it apart with separate: true:
#
#   - source: fpl
#     source_id: "123"      # quote it: YAML reads 0123 as a number
#     season: "2025-26"
#     player: Gabriel
#   - source: fpl
#     source_id: "456"
#     separate: true        # never link this record by name
#
# nicknames: names that a fan uses in a question. They do not match source
# records. An alias must point to one player only, whatever the letter case.

teams:
  - team: Birmingham City
    spellings: [Birmingham]
  - team: Blackburn Rovers
    spellings: [Blackburn]
  - team: Bolton Wanderers
    spellings: [Bolton]
  - team: Charlton Athletic
    spellings: [Charlton]
  - team: Leeds United
    spellings: [Leeds]
  - team: Leicester City
    spellings: [Leicester]
  - team: Manchester City
    spellings: [Man City]
  - team: Manchester United
    spellings: [Man United, Man Utd]
  - team: Newcastle United
    spellings: [Newcastle]
  - team: Nottingham Forest
    spellings: ["Nott'm Forest"]
  - team: Tottenham Hotspur
    spellings: [Tottenham, Spurs]
  - team: Wolverhampton Wanderers
    spellings: [Wolves]

players:
  # FPL Daniel Ballard; scores 88, under the cutoff.
  - source: fpl
    source_id: "531"
    season: "2025-26"
    player: Dan Ballard
  # FPL Gabriel Fernando de Jesus; as close to Gabriel.
  - source: fpl
    source_id: "31"
    season: "2025-26"
    player: Gabriel Jesus
