[project]
name = "ingest"
version = "0.1.0"
description = "Offline loaders: StatsBomb 2003-04, Understat 2025-26 -> Postgres"
requires-python = ">=3.12,<3.13"
dependencies = [
    "statsbombpy>=1.13",
    "httpx>=0.27",
    "pandas>=2.2",
    "psycopg[binary]>=3.2",
    "pyyaml>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
