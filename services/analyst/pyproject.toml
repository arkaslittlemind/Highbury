[project]
name = "analyst"
version = "0.1.0"
description = "Highbury analyst service: FastAPI, LangChain agent, data tools"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary]>=3.2",
    "sqlglot>=25",
    "rapidfuzz>=3.9",
    "mcp>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
