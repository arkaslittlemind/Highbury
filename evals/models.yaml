# The models of the evals and their prices in US dollars for one million tokens.
# The output price includes thinking tokens, and the agent counts them as output.
# decision: the model that the evals chose and why. render writes it into results.md.

models:
  - id: google_genai:gemini-3.8-flash
    input_usd_per_mtok: 0.75
    output_usd_per_mtok: 3.75
    price_source: https://ai.google.dev/gemini-api/docs/pricing
    price_date: "2026-10-14"
    price_note: Paid tier, standard. This price holds until 2026-12-31; from 2027-01-01 it is $1.50 and $7.50.

  - id: google_genai:gemini-3.5-flash-lite
    input_usd_per_mtok: 0.30
    output_usd_per_mtok: 2.50
    price_source: https://ai.google.dev/gemini-api/docs/pricing
    price_date: "2026-10-14"
    price_note: Paid tier, standard.

decision:
  model: google_genai:gemini-3.8-flash
  reason: >-
    In the refresh of 2026-10-25 (24 questions, 2 runs each), Flash answered 24 of
    24 in both runs and Flash-Lite 23 of 24. In both runs of q16 (the xG timeline of
    Tottenham v Arsenal, 2003-04), the claims of Flash-Lite passed the verifier but
    did not hold the xG totals of that match. A gap of one question is a tie, so the
    rule proposes gemini-3.5-flash-lite: about 6 times faster (4.7 s against 28.5 s
    median) and about 5 times cheaper ($0.008 against $0.037 a question). The
    current model stays. Flash-Lite missed q16 in both runs, and it failed the demo
    follow-up (q04, "Only the ones inside the box.") 2 times in 9 tries before this
    refresh: one tool error with no answer in a check of 5 conversations on
    2026-10-14, and one run past the limit of 10 tool calls in the first evals. It
    passed q04 in both runs of this refresh. Flash has failed neither. Look at
    Flash-Lite again after a fix that makes both reliable on it. Production does not
    change.
