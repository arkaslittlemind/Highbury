# The models of the evals and their prices in US dollars for one million tokens.
# The output price includes thinking tokens, and the agent counts them as output.
# decision: the model that the evals chose and why. render writes it into results.md.

models:
  - id: google_genai:gemini-3.8-flash
    input_usd_per_mtok: 0.75
    output_usd_per_mtok: 3.75
    price_source: https://ai.google.dev/gemini-api/docs/pricing
    price_date: "2026-10-14"
    price_note: Paid tier, standard. This price holds until 2026-12-31; from 2027-01-01 it is $1.50 and $7.50.

  - id: google_genai:gemini-3.5-flash-lite
    input_usd_per_mtok: 0.30
    output_usd_per_mtok: 2.50
    price_source: https://ai.google.dev/gemini-api/docs/pricing
    price_date: "2026-10-14"
    price_note: Paid tier, standard.

decision:
  model: google_genai:gemini-3.8-flash
  reason: >-
    After q02 accepted both fair readings, both models answered 15 of 15 questions
    in both runs, so the rule proposes gemini-3.5-flash-lite: about 6 times faster
    (3.8 s against 22.3 s median) and about 5 times cheaper ($0.004 against $0.023
    a question). The current model stays for the reliability of the demo
    follow-up (q04, "Only the ones inside the box."), which is never a kept answer.
    In a check of 5 conversations on 2026-10-14, Flash-Lite failed one with a tool
    error and gave no answer, and it failed the same follow-up once in the first
    evals (past the limit of 10 tool calls): 2 failures in 9 tries. Flash has not
    failed it. Look at Flash-Lite again after a fix that makes the follow-up
    reliable on it. Production does not change.
