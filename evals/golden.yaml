- id: q25
  question: Show Vieira's long passes in 2003-04.
  status: answered
  chart: pass_map
  # The filter of VIEIRA_LONG_PASSES in the prompt, so the claims count the same passes.
  sql: >-
    SELECT count(*) AS passes,
    round(100.0 * count(*) FILTER (WHERE outcome IS NULL) / NULLIF(count(*), 0), 1)
    AS completed_pct
    FROM v_passes WHERE player = 'Patrick Vieira' AND season = '2003-04'
    AND sqrt(power(end_x - x, 2) + power(end_y - y, 2)) >= 35
  note: The done-when question of the pass map.

