  sql: >-
    SELECT home_goals, away_goals FROM v_matches
    WHERE season = '2003-04' AND home_team = 'Arsenal' AND away_team = 'Liverpool'

- id: q10
  question: Show Arsenal's pass network vs Liverpool at home.
  status: answered
  chart: pass_network
  # The default network is the starting XI: the passes before Arsenal's first change.
  sql: >-
    SELECT count(*) AS completed_passes FROM v_passes
    WHERE team = 'Arsenal' AND outcome IS NULL AND recipient IS NOT NULL
    AND match_id = (SELECT match_id FROM v_matches
    WHERE season = '2003-04' AND home_team = 'Arsenal' AND away_team = 'Liverpool')
    AND (period, minute, second) < ALL (SELECT period, minute, second
    FROM v_substitutions WHERE team = 'Arsenal' AND match_id = v_passes.match_id)
  also_sql:
    # The other fair reading: the network of the whole match.
    - >-
      SELECT count(*) AS completed_passes FROM v_passes
      WHERE team = 'Arsenal' AND outcome IS NULL AND recipient IS NOT NULL
      AND match_id = (SELECT match_id FROM v_matches
      WHERE season = '2003-04' AND home_team = 'Arsenal' AND away_team = 'Liverpool')
  note: The fourth suggestion chip.

- id: q11
  question: Who was Arsenal's top league scorer in 2025-26, and how many goals did he score?
  status: answered
  chart: null
  sql: >-
    SELECT goals FROM v_player_season
    WHERE season = '2025-26' ORDER BY goals DESC LIMIT 1
  note: Only the number is checked. The player is Viktor Gyokeres.

- id: q12
  question: How many shots did Arsenal take in the 2025-26 league season, and what was their total xG?
  status: answered
  chart: null
  sql: >-
    SELECT count(*) AS shots, round(sum(xg)::numeric, 2) AS xg FROM v_shots
    WHERE team = 'Arsenal' AND season = '2025-26'

