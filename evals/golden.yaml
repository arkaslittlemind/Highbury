# The golden questions of the evals. Each answered question has hand-written SQL:
# the number cells of its first row are the values that the answer must claim.
# The runner reads the SQL as analyst_ro, so it follows the rules of run_sql.
#
# status: answered | unavailable | out_of_scope
# chart: the chart type that the answer must show, or null for none
# before: questions asked first in the same conversation, not scored
# also_sql: queries of other fair readings; the answer must claim all values of one

- id: q01
  question: Show me Thierry Henry's shots in 2003-04.
  status: answered
  chart: shot_map
  sql: >-
    SELECT count(*) AS shots FROM v_shots
    WHERE player = 'Thierry Henry' AND season = '2003-04'
  note: Demo question 1.

- id: q02
  question: Compare Henry in 2003-04 with Saka in 2025-26 on goals and xG per 90.
  status: answered
  chart: compare_bars
  sql: >-
    SELECT
    (SELECT goals FROM v_player_season
    WHERE player = 'Thierry Henry' AND season = '2003-04') AS henry_goals,
    (SELECT goals FROM v_player_season
    WHERE player = 'Bukayo Saka' AND season = '2025-26') AS saka_goals,
    (SELECT round((xg * 90.0 / minutes)::numeric, 2) FROM v_player_season
    WHERE player = 'Thierry Henry' AND season = '2003-04') AS henry_xg_per_90,
    (SELECT round((xg * 90.0 / minutes)::numeric, 2) FROM v_player_season
    WHERE player = 'Bukayo Saka' AND season = '2025-26') AS saka_xg_per_90
  also_sql:
    # The other fair reading: "per 90" also applies to the goals.
    - >-
      SELECT
      (SELECT round((goals * 90.0 / minutes)::numeric, 2) FROM v_player_season
      WHERE player = 'Thierry Henry' AND season = '2003-04') AS henry_goals_per_90,
      (SELECT round((goals * 90.0 / minutes)::numeric, 2) FROM v_player_season
      WHERE player = 'Bukayo Saka' AND season = '2025-26') AS saka_goals_per_90,
      (SELECT round((xg * 90.0 / minutes)::numeric, 2) FROM v_player_season
      WHERE player = 'Thierry Henry' AND season = '2003-04') AS henry_xg_per_90,
      (SELECT round((xg * 90.0 / minutes)::numeric, 2) FROM v_player_season
      WHERE player = 'Bukayo Saka' AND season = '2025-26') AS saka_xg_per_90
  note: >-
    Demo question 2. Two fair readings: goal totals with xG per 90, or goals per 90
    with xG per 90. The answer also needs the caveat on the two xG models.

