- id: q04
  question: Only the ones inside the box.
  before:
    - Show me Thierry Henry's shots in 2003-04.
  status: answered
  chart: shot_map
  sql: >-
    SELECT count(*) AS shots_in_box FROM v_shots
    WHERE player = 'Thierry Henry' AND season = '2003-04'
    AND x >= 102 AND y BETWEEN 18 AND 62
  note: Demo question 4, a follow-up. The box is the penalty area of the prompt.

