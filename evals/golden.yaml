- id: q28
  question: >-
    How many aerial duels did Patrick Vieira win in 2003-04, and what share of his
    aerial duels was that?
  status: answered
  chart: null
  # A season %, never the mean of the match % values.
  sql: >-
    SELECT sum(aerial_duels_won) AS aerial_duels_won,
    round(100.0 * sum(aerial_duels_won) / NULLIF(sum(aerial_duels), 0), 1)
    AS aerial_duels_won_pct
    FROM v_player_match_advanced WHERE player = 'Patrick Vieira' AND season = '2003-04'

