- id: q07
  question: What was Arsenal's league record in 2003-04, in wins, draws, and losses?
  status: answered
  chart: null
  sql: >-
    SELECT
    count(*) FILTER (WHERE (home_team = 'Arsenal' AND home_goals > away_goals)
    OR (away_team = 'Arsenal' AND away_goals > home_goals)) AS wins,
    count(*) FILTER (WHERE home_goals = away_goals) AS draws,
    count(*) FILTER (WHERE (home_team = 'Arsenal' AND home_goals < away_goals)
    OR (away_team = 'Arsenal' AND away_goals < home_goals)) AS losses
    FROM v_matches
    WHERE season = '2003-04' AND 'Arsenal' IN (home_team, away_team)

